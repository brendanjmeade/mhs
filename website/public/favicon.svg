<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#fff"/>
  <!-- the free surface, which this kernel carries analytically rather than meshing -->
  <line x1="4" y1="20" x2="60" y2="20" stroke="#bbb" stroke-width="3"/>
  <!-- a dipping fault breaking that surface, with its image above it -->
  <path d="M26 20 L46 54" fill="none" stroke="#b5367a" stroke-width="5"
        stroke-linecap="round"/>
  <path d="M26 20 L46 -14" fill="none" stroke="#b5367a" stroke-width="2"
        stroke-linecap="round" stroke-dasharray="4 4" opacity="0.55"/>
</svg>
