name: parity

# NIGHTLY, not per push. These gates import the SYMPY half of the vendored
# oracle, which costs a measured 14.25 s per import because
# mindlin_kernels.py builds and lambdifies ~90 symbolic matrices at module
# scope. Paying that on every push would make the fast suite slow and the slow
# suite ignored.
on:
  schedule:
    # 07:40 UTC. Not on the hour: GitHub's scheduler queues densely there and
    # a cron that drifts an hour is harder to read than one that runs late.
    - cron: "40 7 * * *"
  workflow_dispatch:

jobs:
  parity:
    name: oracle parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CUTDE_USE_BACKEND: cpp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install, with the oracle extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,tde,oracle]"

      # UNDER PYTEST FIRST, deliberately: pytest imports the gates into ONE
      # interpreter, so the 14.25 s oracle import is paid once rather than once
      # per subprocess. run_all.py then re-runs the same set in subprocesses,
      # which is what verify_oracle_provenance needs -- it checks WHICH file
      # each oracle name resolves to and so must own its interpreter.
      - name: Oracle suites (pytest, one interpreter)
        run: python -m pytest -q -m "parity or oracle"

      - name: Everything (run_all, subprocess per gate)
        run: python tests/run_all.py

  # A nightly job that silently stops running is worse than no nightly job, so
  # the full suite is also run on demand from the Actions tab and that path is
  # the same one. If this ever needs a notification it belongs here, not in a
  # second workflow.
